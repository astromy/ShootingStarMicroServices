server:
  port: 7013
  # Compress what is sent to the browser: JSON and scripts shrink to a fraction of their size.
  # HTML is left out on purpose (pages carry the CSRF token; compressing secrets-bearing pages
  # next to attacker-influenced text is what the BREACH attack relies on).
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript,text/javascript,image/svg+xml
    min-response-size: 1KB
  max-http-header-size: 32KB
  netty:
    max-initial-line-length: 19192
    max-chunk-size: 92428800  # 50MB

gateway:
  host: ${APIGATEWAY:http://localhost:8083}

logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO
        security: INFO
        boot:
          autoconfigure: INFO
      springframework.web.client.RestTemplate: INFO

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@localhost:8761/eureka
    registerWithEureka: true
    fetchRegistry: true


spring:
  web:
    error:
      include-stacktrace: always
  mvc:
    throw-exception-if-no-handler-found: true
  thymeleaf:
    cache: false

  codec:
    max-in-memory-size: 20MB

  application:
    name: orb_frontend


  security:
    oauth2:
      client:
        registration:
          ShootingStar:
            client-id: astroauthauth
            client-secret: ${KEYCLOAK-CLIENT-SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/astroauthauth"
            scope:
              - openid
              - profile
              - email
              - roles

        provider:
          ShootingStar:
            issuer-uri: "https://keycloak.astromyllc.com/realms/ShootingStar"

      resource-server:
        jwt:
          issuer-uri: "https://keycloak.astromyllc.com/realms/ShootingStar"
          audiences:
            - orb_frontend
            - astroauthauth


  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
      enabled: true



keycloak:
  security-constraints:
    - security-collections:
        - patterns:
            - webhook/subscriptionPaymentStatus
      oauth2:
        enabled: false



paystack:
  secrete-key: ${PAYSTACK_SECRET_KEY}
  public-key: ${PAYSTACK_PUBLIC_KEY}