spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/administration-pta
  application:
    name: administration-pta
  mongod:
    auto-index-creation: true  # Ensures indexes are created at runtime
  cloud:
    compatibility-verifier:
      enabled: false
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0



  mail:
    # Email rate limiting configuration
    rate-limit: 5
    queue-capacity: 1000

    # Retry configuration
    max-retries: 3
    retry-delay: 5000

    host: smtp.zeptomail.com
    port: 587
    username: emailapikey
    password: ${EMAILPASS}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            trust: "smtp.zeptomail.com"
        debug: false





server:
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:password@localhost:8761/eureka

gateway:
  host: ${APIGATEWAY:localhost}

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      setup:
        registerHealthIndicator: true
        event-consumer-buffer-size: 10
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        authomaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      setup:
        timeout-duration: 3s


logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO
        security: INFO
        boot:
          autoconfigure: INFO
      springframework.web.client.RestTemplate: INFO


keycloak:
  address: ${KeycloakURL:https://keycloak.astromyllc.com}

paystack:
  secrete: ${PAYSTACK_SECRET_KEY}