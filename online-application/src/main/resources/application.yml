spring:
  data:
    mongodb:
      auto-index-creation: true
      uri: mongodb://localhost:27017/online-application
  application:
    name: online-application
  cloud:
    compatibility-verifier:
      enabled: false
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0


  mail:
    host: smtp.zeptomail.com
    port: 587
    username: emailapikey
    password: ${EMAILPASS}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            protocols: TLSv1.2
            trust: "smtp.zeptomail.com"
        debug: false

app:
  mail:
    # Email rate limiting configuration
    rate-limit: 5
    queue-capacity: 1000

    sender: noreply@astromyllc.com
    # Retry configuration
    max-retries: 3
    retry-delay: 5000

  documents:
    birthcerts: E:/Astromy LLC Work/Java Projects/ParentShootingStar/online-application/target/classes/static/applicationDocuments/BirthCerts/
    picture: E:/Astromy LLC Work/Java Projects/ParentShootingStar/online-application/target/classes/static/applicationDocuments/Pictures/


server:
  port: 0

gateway:
  host: ${APIGATEWAY:http://localhost:8083}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@localhost:8761/eureka

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      application:
        registerHealthIndicator: true
        event-consumer-buffer-size: 10
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      application:
        timeout-duration: 150s
  retry:
    instances:
      application:
        max-attempts: 3
        wait-duration: 5s



logging:
  level:
    org:
      springframework:
        security: ERROR
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.boot.autoconfigure: INFO
    org.springframework.web.client.RestTemplate: INFO



paystack:
  secrete: ${PAYSTACK_SECRET_KEY}