server:
  port: 3710
  tomcat:
    max-http-form-post-size: 314572800
    max-swallow-size: 314572800
    connection-timeout: 300000


gateway:
  host: ${APIGATEWAY:http://localhost:8083}


logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.boot.autoconfigure: INFO
    org.springframework.web.client.RestTemplate: DEBUG

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@localhost:8761/eureka
    registerWithEureka: true
    fetchRegistry: true

spring:
  thymeleaf:
    cache: false

  application:
    name: astro-online-application

  servlet:
    multipart:
      max-file-size: 314572800
      max-request-size: 314572800